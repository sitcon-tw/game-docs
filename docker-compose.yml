name: sitconcamp2026-game-docs

services:
  docs:
    image: oven/bun:1
    working_dir: /app
    ports:
      - "${DOCS_PORT:-4321}:4321"
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - bun-cache:/root/.bun
      - node-modules:/app/node_modules
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0 --port 4321

volumes:
  bun-cache:
  node-modules:
